name: PARA preview validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'onboarding.js'
      - 'onboarding.css'
      - 'onboarding-v2.js'
      - 'onboarding-v2.css'
      - 'catalog.json'
      - 'data/**'
      - 'tests/test_frontend.cjs'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'onboarding.js'
      - 'onboarding.css'
      - 'catalog.json'
      - 'data/**'
      - 'tests/test_frontend.cjs'
      - '.github/workflows/ui.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate website JavaScript and all cached group snapshots
        run: node tests/test_frontend.cjs
