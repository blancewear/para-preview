name: PARA SAFU group catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    paths:
      - 'scripts/collect_catalog.py'
      - '.github/workflows/catalog.yml'

permissions:
  contents: write

concurrency:
  group: para-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RUZ index and institution catalogues only
        run: python scripts/collect_catalog.py --output catalog.json
      - name: Publish only complete validated catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh verified SAFU group catalogue'
            git push
          fi
