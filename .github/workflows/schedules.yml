name: PARA official RUZ full schedule publisher

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Scan every group in bounded batches'
        required: false
        type: boolean
        default: true
  schedule:
    - cron: '12,27,42,57 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_schedules.py'
      - 'tests/test_schedules.py'
      - '.github/workflows/schedules.yml'
  pull_request:
    paths:
      - 'scripts/collect_schedules.py'
      - 'tests/test_schedules.py'
      - '.github/workflows/schedules.yml'

permissions:
  contents: write

concurrency:
  group: para-schedule-data
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_schedules.py' -v
      - run: python -m py_compile scripts/collect_schedules.py

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parser and snapshot protections
        run: |
          python -m unittest discover -s tests -p 'test_schedules.py' -v
          python -m py_compile scripts/collect_schedules.py
      - name: Check front-end schedule wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert './data/schedules/' in html
          assert "if(group!=='171605')" not in html
          print('Group selector and schedule source: OK')
          PY
      - name: Collect all groups on rollout, smaller batches on recurring schedule
        shell: bash
        env:
          FULL_REFRESH: ${{ github.event_name == 'push' || inputs.full_refresh == true }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          if [[ "$FULL_REFRESH" == 'true' ]]; then
            batches=8
            limit=120
          else
            batches=1
            limit=36
          fi
          for (( batch=1; batch<=batches; batch++ )); do
            echo "::group::Official RUZ batch $batch of $batches"
            python scripts/collect_schedules.py --root . --limit "$limit" --pause 1.6
            git add -A data/
            if ! git diff --cached --quiet; then
              git commit -m "data: refresh verified RUZ group batch $batch/$batches"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
            echo "::endgroup::"
          done
      - name: Validate published catalogue/schedule bookkeeping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          state = json.loads(Path('data/sync_state.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          known = {str(g['id']) for g in catalog['groups']}
          cached = {p.stem for p in Path('data/schedules').glob('*.json')}
          assert len(known) >= 150
          assert cached <= known
          assert len(cached) == status['groups_cached_total']
          assert 0 <= state['cursor'] < len(known)
          print(f"Catalogue: {len(known)}; published group schedules: {len(cached)}; cursor: {state['cursor']}")
          PY
