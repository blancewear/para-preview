name: PARA complete official RUZ timetable publisher

on:
  workflow_dispatch:
  schedule:
    # Try every 20 minutes. GitHub may delay scheduled starts; actual timing
    # is measured in status.json, not promised as a hard deadline.
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_schedules.py'
      - 'tests/test_schedules.py'
      - '.github/workflows/schedules.yml'
  pull_request:
    paths:
      - 'scripts/collect_schedules.py'
      - 'tests/test_schedules.py'
      - '.github/workflows/schedules.yml'

permissions:
  contents: write

# Heavy RUZ collectors are serialized with the TANDEM college publisher.
# Read-only PR checks never wait behind a long full-university sweep.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('para-ruz-review-{0}', github.ref) || 'para-schedule-data' }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify parallel publisher and last-good protections
        run: |
          python -m unittest discover -s tests -p 'test_schedules.py' -v
          python -m py_compile scripts/collect_schedules.py

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check parser correctness and data-loss protections
        run: |
          python -m unittest discover -s tests -p 'test_schedules.py' -v
          python -m py_compile scripts/collect_schedules.py
      - name: Full official catalogue sweep with three paced requests
        run: |
          python scripts/collect_schedules.py --root . --all --workers 3 --interval 0.9
      - name: Reject incomplete or inconsistent publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path('catalog.json').read_text(encoding='utf-8'))
          status = json.loads(Path('data/status.json').read_text(encoding='utf-8'))
          state = json.loads(Path('data/sync_state.json').read_text(encoding='utf-8'))
          expected = len(catalog['groups'])
          completed = status['groups_completed']
          assert 150 <= expected <= 5000
          assert status['full_refresh'] is True
          assert status['groups_total'] == status['groups_attempted'] == completed == expected
          assert status['groups_ok'] + status['groups_empty'] + status['groups_failed'] == expected
          assert len(status['cached_ids']) == status['groups_cached_total']
          assert status['groups_cached_total'] >= 1
          assert state['cursor'] == 0
          print('RUZ sweep complete:', status['checked_at'], 'of', expected,
                'ok', status['groups_ok'], 'empty', status['groups_empty'],
                'failed', status['groups_failed'],
                'cached', status['groups_cached_total'],
                'seconds', status['scan_duration_seconds'])
          PY
      - name: Publish only verified changes; retry competing main updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add -A data/
          if git diff --cached --quiet; then
            echo 'No verified RUZ changes to publish'
            exit 0
          fi
          git commit -m 'data: full verified official RUZ refresh'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'Published complete checked sweep'
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Cannot safely reconcile timetable publication' >&2
          exit 1
