name: PARA preview smoke checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check onboarding-v2.js
      - name: Check embedded app JavaScript
        run: |
          node - <<'JS'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const parts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!parts.length) throw new Error('Inline app script missing');
          new Function(parts[parts.length - 1][1]);
          console.log('Embedded app JavaScript valid');
          JS
      - name: Verify HTML wiring and real stream data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html = Path("index.html").read_text()
          css = Path("onboarding-v2.css").read_text()
          js = Path("onboarding-v2.js").read_text()
          assert 'onboarding-v2.css?v=6' in html
          assert 'onboarding-v2.js?v=7' in html
          assert 'id="onboard"' in html
          assert "obBoot();" not in html
          assert "border-radius:999px" in css
          assert "height:100dvh" in css
          assert "p2-count" not in js
          assert "p2-kicker" not in js
          app = Path("para-ui-v6.css").read_text()
          assert 'para-ui-v6.css?v=1' in html
          assert 'app-shell-v3.css?v=2' not in html
          assert 'mobile-layout-v5.css?v=1' not in html
          assert 'height:100dvh' in app
          assert 'max-width:var(--para-width)' in app
          assert 'overflow-x:hidden' in app
          assert 'grid-template-columns:repeat(3,minmax(0,1fr))' in app
          assert 'position:relative;left:auto;right:auto;bottom:auto;transform:none' in app
          assert 'id="profileGroupNumber"' in html
          assert 'id="editStudy"' in html
          assert 'id="saveVK"' in html
          assert 'id="saveStudy"' in html
          for id in ("fill", "users", "reminders", "changes", "rooms", "minutes", "scope",
                     "groupResults", "institutionInput", "institutionRuzLink",
                     "vkInput", "saveVK", "reset"):
              assert f'id="{id}"' in html
          for label in ("Бот для домашних заданий ВК","Учебные материалы группы","Журнал старосты"):
              assert label in html
          assert "function refreshSuggestions()" in html
          assert "function loadInstitutions()" in html
          assert "window.paraOpenOnboarding=reopen" in js
          assert "function schedule()" in html
          assert "function profile()" in html
          assert ".clean-row" in app and ".lesson" in app
          assert "obBoot()" not in html
          assert "function drawLanguages()" in js
          assert "function drawSubgroups()" in js
          data = json.loads(Path("data/schedules/21096.json").read_text())
          lessons = [x for p in data["periods"] for x in p.get("lessons", [])]
          assert any(x.get("subgroup") == "171605_01" for x in lessons)
          assert any(x.get("stream") == "ИЯ_Немецкий_02" for x in lessons)
          print("Preview markup, script, styles and dataset validated")
          PY

  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate app geometry in real Chromium
        run: node scripts/check-mobile-layout.mjs
